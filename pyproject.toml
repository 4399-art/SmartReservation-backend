[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.115.13",
    "uvicorn==0.34.0",
    "sqlalchemy==2.0.41",
    "pymysql==1.1.1",
    "pydantic==2.10.6",
    "pydantic-settings==2.7.1",
    "bcrypt==5.0.0",
    "PyJWT==2.13.0",
    "python-multipart>=0.0.32",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
